<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليل</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <section class="hero">
      <div class="logo-wrap">
        <div class="palm-logo">
          <span class="leaf leaf-1"></span>
          <span class="leaf leaf-2"></span>
          <span class="leaf leaf-3"></span>
          <span class="leaf leaf-4"></span>
          <span class="leaf leaf-5"></span>
          <span class="trunk"></span>
        </div>
      </div>

      <h1 class="title">دليل</h1>
      <p class="subtitle">
       الذكاء الاصطناعي هو لغة المستقبل، ودليل يساعدك على فهم مفاهيمه الأساسية بطريقة بسيطة.
      </p>
    </section>

    <section class="chat-shell">
      <div id="chatMessages" class="chat-messages"></div>

      <form id="chatForm" class="chat-input-area">
        <input
          id="chatInput"
          type="text"
          placeholder="اكتب سؤالك هنا..."
          autocomplete="off"
        />
        <button type="submit">إرسال</button>
      </form>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
